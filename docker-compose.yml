services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: painting
      POSTGRES_PASSWORD: painting
      POSTGRES_DB: painting
      TZ: Asia/Kuala_Lumpur
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U painting -d painting']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
