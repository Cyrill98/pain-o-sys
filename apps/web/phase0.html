<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase 0: recolor test (dev only)</title>
    <style>
      body {
        margin: 0;
        font:
          13px system-ui,
          sans-serif;
        background: #fff;
        color: #111;
      }
      h1 {
        font-size: 16px;
        margin: 8px;
      }
      .row {
        display: grid;
        grid-template-columns: 24px repeat(3, 1fr);
        gap: 4px;
        margin: 0 4px 6px;
        align-items: start;
      }
      .row canvas {
        width: 100%;
        height: auto;
        display: block;
        background: #eee;
      }
      .n {
        font-weight: 700;
      }
      .meta {
        grid-column: 2 / -1;
        color: #555;
        margin-top: -2px;
      }
    </style>
  </head>
  <body>
    <h1>Phase 0 recolor test (dev only, not part of the app build)</h1>
    <div id="out"></div>
    <script type="module" src="/src/phase0/main.ts"></script>

</html>
